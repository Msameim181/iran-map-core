version: 2
updates:
  # Actions are pinned by SHA; Dependabot keeps the pin and the version comment together. Minor and patch bumps
  # are grouped; each major bump gets its own PR so it can be checked with the release.yml dry run
  # (Actions > Release > Run workflow) before merging, because the actions used there are on the publish path.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint peers typescript <6.1, so Dependabot cannot resolve a TypeScript 7 update
      # ("dependency_file_not_resolvable ... Error while updating peer dependency"), and so can a 6.1 minor. Revisit when typescript-eslint
      # supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # ESLint 10 is the configured major (flat config); hold back anything newer until the config and plugins are checked.
      - dependency-name: eslint
        versions: ['>=11']
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
