name: Release

# Pushing a v* tag verifies the package, then publishes it. The build/verify jobs are read-only; only the publish
# jobs hold a write permission. No personal tokens: GitHub Packages uses the built-in GITHUB_TOKEN and npmjs uses
# trusted publishing (OIDC).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match package.json version ${version}" >&2
            exit 1
          fi
          # A prerelease (x.y.z-rc.1) must never take the latest dist-tag.
          if [[ "${version}" == *-* ]]; then dist_tag=next; prerelease=true; else dist_tag=latest; prerelease=false; fi
          {
            echo "version=${version}"
            echo "dist_tag=${dist_tag}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tagged commit ${GITHUB_SHA} is not on main" >&2
            exit 1
          fi

  verify:
    needs: guard
    uses: ./.github/workflows/verify.yml

  publish-github-packages:
    needs: [guard, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@msameim181'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: package
      - name: Publish (skipped if this version already exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
          DIST_TAG: ${{ needs.guard.outputs.dist_tag }}
        run: |
          name="$(tar -xzOf package/*.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")"
          if npm view "${name}@${VERSION}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "${name}@${VERSION} is already published to GitHub Packages; skipping"
          else
            npm publish ./package/*.tgz --tag "${DIST_TAG}" --registry https://npm.pkg.github.com
          fi

  github-release:
    needs: [guard, publish-github-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: package
      - name: Create the GitHub Release from the changelog (skipped if it exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping"
            exit 0
          fi
          awk -v v="${VERSION}" '$0 ~ "^## \\["v"\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          flags=()
          if [ "${PRERELEASE}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "${TAG}" package/*.tgz --title "${TAG}" --notes-file notes.md --verify-tag "${flags[@]}"

  # npmjs.org via trusted publishing (OIDC): no token. Skipped until the repository variable NPM_PUBLISH is 'true',
  # which is set once the trusted publisher is configured on npmjs.com for this repository and workflow.
  publish-npmjs:
    needs: [guard, verify]
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11.5.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: package
      - name: Publish (skipped if this version already exists)
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          DIST_TAG: ${{ needs.guard.outputs.dist_tag }}
        run: |
          name="$(tar -xzOf package/*.tgz package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")"
          if npm view "${name}@${VERSION}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${name}@${VERSION} is already on npmjs; skipping"
          else
            npm publish ./package/*.tgz --access public --tag "${DIST_TAG}" --registry https://registry.npmjs.org
          fi
