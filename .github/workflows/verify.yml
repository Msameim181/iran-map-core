name: Verify

# Reusable: runs every gate and uploads the packed tarball as the "package" artifact. Called by CI and by Release.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Check the package (publint, are-the-types-wrong)
        run: npm run check:package
      - name: Type-check TypeScript consumers of the packed tarball
        run: node scripts/smoke-types.mjs
      - name: Check lightness budgets and tree-shaking
        run: npm run check:size
      - name: Pack
        run: |
          mkdir -p package
          npm pack --ignore-scripts --pack-destination package
      - name: Dry-run the publish command
        # A bare "package/x.tgz" is parsed by npm as a GitHub shorthand, so the path must start with ./
        run: npm publish ./package/*.tgz --dry-run --registry https://npm.pkg.github.com
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/*.tgz
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      - name: Import and require every entry of the packed tarball
        run: node scripts/smoke-runtime.mjs package/*.tgz
