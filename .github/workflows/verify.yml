name: Verify

# Reusable: runs every gate and uploads the packed tarball as the "package" artifact. Called by CI and by Release.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Check the package (publint, are-the-types-wrong)
        run: npm run check:package
      - name: Type-check TypeScript consumers of the packed tarball
        run: node scripts/smoke-types.mjs
      - name: Check lightness budgets and tree-shaking
        run: npm run check:size
      - name: Pack
        run: |
          mkdir -p package
          npm pack --ignore-scripts --pack-destination package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: package/*.tgz
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: package
      - name: Import and require every entry of the packed tarball
        run: node scripts/smoke-runtime.mjs package/*.tgz
